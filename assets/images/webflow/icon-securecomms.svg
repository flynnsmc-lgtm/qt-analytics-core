  <line x1="20" y1="24" x2="32" y2="16" stroke="url(#comm-grad)" stroke-width="2" />
  <line x1="32" y1="16" x2="44" y2="24" stroke="url(#comm-grad)" stroke-width="2" />
  <line x1="44" y1="24" x2="40" y2="42" stroke="url(#comm-grad)" stroke-width="2" />
