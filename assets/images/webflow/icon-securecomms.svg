  <line x1="24" y1="42" x2="20" y2="24" stroke="url(#comm-grad)" stroke-width="2" />
  <line x1="32" y1="16" x2="32" y2="34" stroke="url(#comm-grad)" stroke-width="1.5" stroke-dasharray="2,2" />
  <line x1="20" y1="24" x2="32" y2="34" stroke="url(#comm-grad)" stroke-width="1.5" stroke-dasharray="2,2" />
  <line x1="44" y1="24" x2="32" y2="34" stroke="url(#comm-grad)" stroke-width="1.5" stroke-dasharray="2,2" />
  <!-- Node Dots -->
  <circle cx="20" cy="24" r="4" fill="#00f0ff" />
  <circle cx="32" cy="16" r="4" fill="#10b981" />
  <circle cx="44" cy="24" r="4" fill="#00f0ff" />
  <circle cx="40" cy="42" r="4" fill="#10b981" />
  <circle cx="24" cy="42" r="4" fill="#00f0ff" />
  <circle cx="32" cy="34" r="5" fill="#38bdf8" />
</svg>
