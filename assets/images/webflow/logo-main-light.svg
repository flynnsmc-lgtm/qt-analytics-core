<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 60" width="300" height="60">
  <defs>
    <linearGradient id="logo-cyan-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Orbit Ring Mark -->
  <g transform="translate(10, 5)">
    <circle cx="25" cy="25" r="22" fill="none" stroke="rgba(0, 240, 255, 0.25)" stroke-width="1.5" />
    <ellipse cx="25" cy="25" rx="24" ry="10" fill="none" stroke="url(#logo-cyan-grad)" stroke-width="2" transform="rotate(-25 25 25)" />
    <!-- Core Nucleus -->
    <circle cx="25" cy="25" r="7" fill="url(#logo-cyan-grad)" filter="url(#glow)" />
    <circle cx="43" cy="18" r="3" fill="#38bdf8" filter="url(#glow)" />
  </g>
  <!-- Brand Wordmark -->
  <text x="75" y="37" font-family="'Inter', -apple-system, sans-serif" font-weight="900" font-size="24" fill="#ffffff" letter-spacing="1.5">
    QT <tspan fill="#00f0ff">ANALYTICS</tspan>
  </text>
  <text x="76" y="50" font-family="'Inter', -apple-system, sans-serif" font-weight="600" font-size="9" fill="#94a3b8" letter-spacing="3">
    PRECISION • GEOSPATIAL • CONNECTED
  </text>
</svg>
