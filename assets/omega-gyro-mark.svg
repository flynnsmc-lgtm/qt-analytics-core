<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="emblemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="emblemGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  <!-- Outer Dark Metallic Disc -->
  <rect x="5" y="5" width="110" height="110" rx="28" fill="#030712" stroke="#00f0ff" stroke-width="2.5" stroke-opacity="0.6" />
  
  <!-- Inner Subtle Grid Lines -->
  <circle cx="60" cy="60" r="46" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1" />
  <circle cx="60" cy="60" r="32" fill="none" stroke="rgba(0,240,255,0.12)" stroke-width="1" />
  
  <!-- Dual Interlocking Hopf Fiber Orbits -->
  <ellipse cx="60" cy="60" rx="42" ry="18" fill="none" stroke="#8b5cf6" stroke-width="2.2" stroke-dasharray="6 4" opacity="0.8" transform="rotate(35 60 60)" />
  <ellipse cx="60" cy="60" rx="42" ry="18" fill="none" stroke="#00f0ff" stroke-width="2.2" stroke-dasharray="6 4" opacity="0.8" transform="rotate(-35 60 60)" />
  
  <!-- Central Omega Core -->
  <path d="M 40 80 L 49 80 A 18 18 0 1 1 71 80 L 80 80" fill="none" stroke="url(#emblemGrad)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#emblemGlow)" />
  
  <!-- Center Invariant Singularity -->
  <circle cx="60" cy="56" r="4.5" fill="#ffffff" />
  <circle cx="60" cy="56" r="1.8" fill="#00f0ff" />
</svg>
