<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QT Backoffice — Interactive Agent & ARKM Workflow Canvas</title>
  <meta name="description" content="Drag-and-drop workflow designer to map agent coordination pipelines, ARKM forensic steps, and operational gaps.">

  <!-- Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-base: #07090e;
      --bg-grid: #0d1322;
      --bg-card: rgba(15, 23, 42, 0.85);
      --bg-card-hover: rgba(22, 32, 58, 0.95);
      --border-subtle: rgba(255, 255, 255, 0.1);
      --border-cyan: #00f2fe;
      --border-amber: #f59e0b;
      --border-emerald: #10b981;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --accent-cyan: #00f2fe;
      --accent-blue: #4facfe;
      --accent-amber: #f59e0b;
      --accent-emerald: #10b981;
      --accent-rose: #f43f5e;
      --font-display: 'Outfit', sans-serif;
      --font-body: 'Plus Jakarta Sans', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-base);
      color: var(--text-primary);
      font-family: var(--font-body);
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      user-select: none;
    }

    /* Top Navigation & Toolbar */
    .top-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 64px;
      background: rgba(10, 15, 28, 0.9);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      z-index: 1000;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-title {
      font-family: var(--font-display);
      font-size: 17px;
      font-weight: 700;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .badge-backoffice {
      font-family: var(--font-mono);
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 4px;
      background: rgba(0, 242, 254, 0.12);
      border: 1px solid rgba(0, 242, 254, 0.3);
      color: var(--accent-cyan);
    }

    .toolbar-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-tool {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-subtle);
      color: var(--text-primary);
      font-family: var(--font-body);
      font-size: 13px;
      font-weight: 600;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .btn-tool:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: var(--border-cyan);
      color: var(--accent-cyan);
    }

    .btn-tool.active {
      background: rgba(245, 158, 11, 0.15);
      border-color: var(--border-amber);
      color: var(--accent-amber);
    }

    .btn-primary-tool {
      background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
      border: none;
      color: #07090e;
      font-weight: 700;
    }

    .btn-primary-tool:hover {
      box-shadow: 0 0 16px rgba(0, 242, 254, 0.4);
      color: #000;
    }

    .stats-pill-group {
      display: flex;
      align-items: center;
      gap: 12px;
      font-family: var(--font-mono);
      font-size: 12px;
    }

    .stat-pill {
      background: rgba(255, 255, 255, 0.03);
      padding: 5px 10px;
      border-radius: 4px;
      border: 1px solid var(--border-subtle);
    }

    .stat-val {
      font-weight: 700;
      color: var(--accent-cyan);
    }

    .stat-val.amber {
      color: var(--accent-amber);
    }

    /* Infinite Canvas Area */
    .canvas-container {
      position: absolute;
      top: 64px;
      left: 0;
      right: 0;
      bottom: 0;
      overflow: hidden;
      background-color: var(--bg-base);
      background-image: 
        radial-gradient(circle, rgba(255, 255, 255, 0.08) 1px, transparent 1px);
      background-size: 28px 28px;
    }

    /* SVG Connector Overlay */
    #connector-svg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10;
    }

    .wire-path {
      fill: none;
      stroke: rgba(0, 242, 254, 0.55);
      stroke-width: 2.5px;
      stroke-dasharray: 6 3;
      animation: dashMove 30s linear infinite;
    }

    .wire-path.gap-wire {
      stroke: rgba(245, 158, 11, 0.7);
      stroke-width: 3px;
    }

    @keyframes dashMove {
      to {
        stroke-dashoffset: -1000;
      }
    }

    /* Draggable Workflow Node */
    .workflow-node {
      position: absolute;
      width: 280px;
      background: var(--bg-card);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      padding: 16px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
      cursor: grab;
      z-index: 20;
      transition: box-shadow 0.2s ease, border-color 0.2s ease;
    }

    .workflow-node:active {
      cursor: grabbing;
    }

    .workflow-node.selected {
      border-color: var(--accent-cyan);
      box-shadow: 0 0 20px rgba(0, 242, 254, 0.35);
    }

    .workflow-node.is-gap {
      border-color: var(--border-amber);
      background: rgba(30, 20, 10, 0.85);
    }

    .workflow-node.gap-highlight {
      animation: pulseAmber 1.8s infinite;
    }

    @keyframes pulseAmber {
      0% { box-shadow: 0 0 10px rgba(245, 158, 11, 0.4); }
      50% { box-shadow: 0 0 28px rgba(245, 158, 11, 0.85); border-color: #fbbf24; }
      100% { box-shadow: 0 0 10px rgba(245, 158, 11, 0.4); }
    }

    .node-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .node-stage-badge {
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 3px;
      text-transform: uppercase;
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-secondary);
    }

    .node-stage-badge.verified {
      background: rgba(16, 185, 129, 0.15);
      color: var(--accent-emerald);
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .node-stage-badge.gap {
      background: rgba(245, 158, 11, 0.2);
      color: var(--accent-amber);
      border: 1px solid rgba(245, 158, 11, 0.4);
    }

    .node-delete-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 14px;
      padding: 2px 6px;
      border-radius: 4px;
    }

    .node-delete-btn:hover {
      color: var(--accent-rose);
      background: rgba(244, 63, 94, 0.1);
    }

    .node-title {
      font-family: var(--font-display);
      font-size: 15px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 4px;
      outline: none;
    }

    .node-title:focus {
      border-bottom: 1px dashed var(--accent-cyan);
    }

    .node-subtitle {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--accent-cyan);
      margin-bottom: 10px;
      outline: none;
    }

    .node-desc {
      font-size: 12.5px;
      color: var(--text-secondary);
      line-height: 1.45;
      outline: none;
    }

    .node-desc:focus {
      background: rgba(255, 255, 255, 0.03);
      border-radius: 4px;
      padding: 4px;
    }

    /* Connection Ports */
    .port {
      position: absolute;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #0f172a;
      border: 2px solid var(--accent-cyan);
      cursor: crosshair;
      transition: transform 0.15s ease, background-color 0.15s ease;
      z-index: 30;
    }

    .port:hover {
      transform: scale(1.3);
      background: var(--accent-cyan);
    }

    .port-in {
      top: 50%;
      left: -7px;
      transform: translateY(-50%);
    }

    .port-out {
      top: 50%;
      right: -7px;
      transform: translateY(-50%);
      border-color: var(--accent-emerald);
    }

    .port-out:hover {
      background: var(--accent-emerald);
    }

    /* Instructions / Help Overlay */
    .help-pill {
      position: fixed;
      bottom: 20px;
      right: 24px;
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border-subtle);
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 12px;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 1000;
    }
  </style>
</head>
<body>

  <!-- Top Bar -->
  <header class="top-bar">
    <div class="brand-group">
      <div class="brand-title">
        <span>⚡ QT BACKOFFICE</span>
        <span class="badge-backoffice">WORKFLOW DESIGNER</span>
      </div>
    </div>

    <div class="toolbar-actions">
      <button class="btn-tool btn-primary-tool" id="btn-add-node">
        + Add Step
      </button>

      <button class="btn-tool" id="btn-load-arkm">
        Template: ARKM Forensics
      </button>

      <button class="btn-tool" id="btn-load-agents">
        Template: AI Studio Pipeline
      </button>

      <button class="btn-tool" id="btn-toggle-gaps">
        ⚠️ Highlight Gaps
      </button>

      <button class="btn-tool" id="btn-export-json">
        Export JSON
      </button>

      <button class="btn-tool" id="btn-clear">
        Clear Canvas
      </button>
    </div>

    <div class="stats-pill-group">
      <div class="stat-pill">Steps: <span class="stat-val" id="val-total-steps">0</span></div>
      <div class="stat-pill">Links: <span class="stat-val" id="val-total-links">0</span></div>
      <div class="stat-pill">Identified Gaps: <span class="stat-val amber" id="val-total-gaps">0</span></div>
    </div>
  </header>

  <!-- Interactive Canvas -->
  <div class="canvas-container" id="canvas">
    <svg id="connector-svg">
      <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 1 L 10 5 L 0 9 z" fill="rgba(0, 242, 254, 0.8)"/>
        </marker>
        <marker id="arrow-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 1 L 10 5 L 0 9 z" fill="rgba(245, 158, 11, 0.9)"/>
        </marker>
      </defs>
    </svg>
  </div>

  <!-- Help / Shortcut Pill -->
  <div class="help-pill">
    <span>💡 <strong>Tip:</strong> Drag boxes to arrange. Click port on right and connect to port on left. Edit any title or text directly.</span>
    <a href="./qt_analytics.html" style="color: var(--accent-cyan); text-decoration: none; font-weight: 600;">← Back to Commercial Portal</a>
  </div>

  <script>
    // State
    let nodes = [];
    let connections = [];
    let isConnecting = false;
    let connectSourceId = null;
    let highlightGapsActive = false;

    const canvas = document.getElementById('canvas');
    const svg = document.getElementById('connector-svg');

    // Preset 1: ARKM Forensics Pipeline
    const PRESET_ARKM = [
      {
        id: 'node-1',
        x: 80,
        y: 100,
        badge: 'STAGE 1',
        isGap: false,
        title: 'Raw Tx Ingestion',
        subtitle: 'Source Capture',
        desc: 'Detect initial victim drain or unauthorized multi-sig execution hash (e.g. 0x71C...49A).'
      },
      {
        id: 'node-2',
        x: 420,
        y: 100,
        badge: 'STAGE 1',
        isGap: false,
        title: 'Arkham Ultra Clustering',
        subtitle: 'Address Labeling',
        desc: 'Cross-reference destination wallet against 50+ entity clusters (exchanges, desks, mixers).'
      },
      {
        id: 'node-3',
        x: 760,
        y: 60,
        badge: 'STAGE 2',
        isGap: false,
        title: 'Peel Chain Hop Analysis',
        subtitle: 'Obfuscation Layer',
        desc: 'Map sequential split transactions across 6-hop transaction DAGs before mixer entry.'
      },
      {
        id: 'node-4',
        x: 760,
        y: 280,
        badge: '⚠️ WORKFLOW GAP',
        isGap: true,
        title: 'Zero-Knowledge Unmixing',
        subtitle: 'Railgun & Tornado',
        desc: 'GAP: Need automated withdrawal heuristic matching based on gas timestamp correlation.'
      },
      {
        id: 'node-5',
        x: 1100,
        y: 160,
        badge: 'STAGE 3',
        isGap: false,
        title: 'Deposit Gateway Intercept',
        subtitle: 'Binance / Kraken Liaison',
        desc: 'Flag CEX deposit address and prepare fast-loop freeze package with >88% recovery potential.'
      }
    ];

    const CONNECTIONS_ARKM = [
      { from: 'node-1', to: 'node-2' },
      { from: 'node-2', to: 'node-3' },
      { from: 'node-2', to: 'node-4' },
      { from: 'node-3', to: 'node-5' },
      { from: 'node-4', to: 'node-5' }
    ];

    // Preset 2: AI Studio Multi-Agent Pipeline
    const PRESET_AGENTS = [
      {
        id: 'agent-1',
        x: 80,
        y: 150,
        badge: 'API GATEWAY',
        isGap: false,
        title: 'AI Studio Reception',
        subtitle: 'Session Dispatch',
        desc: 'Ingests user prompt, target wallet hash, and allocates context across subagent channels.'
      },
      {
        id: 'agent-2',
        x: 420,
        y: 80,
        badge: 'LIBRARIAN',
        isGap: false,
        title: 'Librarian Agent',
        subtitle: 'Dossier Lookup',
        desc: 'Retrieves prior entity intelligence from pairoq_crm_contacts.json and GoldStandardLibrary.'
      },
      {
        id: 'agent-3',
        x: 420,
        y: 290,
        badge: '⚠️ GAP DETECTED',
        isGap: true,
        title: 'Live API Rate Throttle',
        subtitle: '3.0s Delay Enforcement',
        desc: 'GAP: Ensure rate limit handler catches 503 capacity errors and queues requests safely.'
      },
      {
        id: 'agent-4',
        x: 780,
        y: 150,
        badge: 'SYNTHESIS',
        isGap: false,
        title: 'Forensic Synthesis Engine',
        subtitle: 'SAR Evidence Pack',
        desc: 'Combines DAG visualizer with legal statutory references (POCA s.327) into final £49–£500 deliverable.'
      }
    ];

    const CONNECTIONS_AGENTS = [
      { from: 'agent-1', to: 'agent-2' },
      { from: 'agent-1', to: 'agent-3' },
      { from: 'agent-2', to: 'agent-4' },
      { from: 'agent-3', to: 'agent-4' }
    ];

    function renderCanvas() {
      // Clear existing node DOM elements (keep SVG)
      document.querySelectorAll('.workflow-node').forEach(n => n.remove());

      nodes.forEach(node => {
        const div = document.createElement('div');
        div.className = `workflow-node ${node.isGap ? 'is-gap' : ''} ${highlightGapsActive && node.isGap ? 'gap-highlight' : ''}`;
        div.id = node.id;
        div.style.left = `${node.x}px`;
        div.style.top = `${node.y}px`;

        div.innerHTML = `
          <div class="node-header">
            <span class="node-stage-badge ${node.isGap ? 'gap' : 'verified'}">${node.badge}</span>
            <button class="node-delete-btn" title="Delete Step" onclick="deleteNode('${node.id}')">&times;</button>
          </div>
          <div class="node-title" contenteditable="true">${node.title}</div>
          <div class="node-subtitle" contenteditable="true">${node.subtitle}</div>
          <div class="node-desc" contenteditable="true">${node.desc}</div>
          <div class="port port-in" title="Connect Input" data-id="${node.id}" data-type="in"></div>
          <div class="port port-out" title="Drag to Connect Output" data-id="${node.id}" data-type="out"></div>
        `;

        // Inline edit listeners
        div.querySelector('.node-title').addEventListener('blur', (e) => { node.title = e.target.innerText; });
        div.querySelector('.node-subtitle').addEventListener('blur', (e) => { node.subtitle = e.target.innerText; });
        div.querySelector('.node-desc').addEventListener('blur', (e) => { node.desc = e.target.innerText; });

        // Port Click Listener for connection creation
        const outPort = div.querySelector('.port-out');
        const inPort = div.querySelector('.port-in');

        outPort.addEventListener('click', (e) => {
          e.stopPropagation();
          startConnection(node.id);
        });

        inPort.addEventListener('click', (e) => {
          e.stopPropagation();
          finishConnection(node.id);
        });

        // Draggable Handler
        setupDraggable(div, node);

        canvas.appendChild(div);
      });

      updateLines();
      updateStats();
    }

    function setupDraggable(element, node) {
      let isDragging = false;
      let startX, startY;

      element.addEventListener('mousedown', (e) => {
        if (e.target.classList.contains('port') || e.target.classList.contains('node-delete-btn') || e.target.isContentEditable) {
          return;
        }
        isDragging = true;
        startX = e.clientX - node.x;
        startY = e.clientY - node.y;
        element.classList.add('selected');
      });

      window.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        node.x = Math.max(20, e.clientX - startX);
        node.y = Math.max(20, e.clientY - startY);
        element.style.left = `${node.x}px`;
        element.style.top = `${node.y}px`;
        updateLines();
      });

      window.addEventListener('mouseup', () => {
        if (isDragging) {
          isDragging = false;
          element.classList.remove('selected');
        }
      });
    }

    function startConnection(nodeId) {
      isConnecting = true;
      connectSourceId = nodeId;
      const nodeEl = document.getElementById(nodeId);
      if (nodeEl) nodeEl.classList.add('selected');
    }

    function finishConnection(targetId) {
      if (isConnecting && connectSourceId && connectSourceId !== targetId) {
        // Prevent duplicate connection
        const exists = connections.some(c => c.from === connectSourceId && c.to === targetId);
        if (!exists) {
          connections.push({ from: connectSourceId, to: targetId });
        }
      }
      isConnecting = false;
      connectSourceId = null;
      document.querySelectorAll('.workflow-node').forEach(n => n.classList.remove('selected'));
      updateLines();
      updateStats();
    }

    function updateLines() {
      // Clear all path wires except defs
      const existingPaths = svg.querySelectorAll('.wire-path');
      existingPaths.forEach(p => p.remove());

      connections.forEach(conn => {
        const fromNode = nodes.find(n => n.id === conn.from);
        const toNode = nodes.find(n => n.id === conn.to);
        if (!fromNode || !toNode) return;

        // Calculate port positions
        const x1 = fromNode.x + 280; // right edge
        const y1 = fromNode.y + 70;  // middle height
        const x2 = toNode.x;         // left edge
        const y2 = toNode.y + 70;

        const isGapConn = fromNode.isGap || toNode.isGap;

        // Smooth cubic bezier curve
        const dx = Math.max(40, (x2 - x1) * 0.5);
        const pathData = `M ${x1} ${y1} C ${x1 + dx} ${y1}, ${x2 - dx} ${y2}, ${x2} ${y2}`;

        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        path.setAttribute('d', pathData);
        path.setAttribute('class', `wire-path ${isGapConn ? 'gap-wire' : ''}`);
        path.setAttribute('marker-end', isGapConn ? 'url(#arrow-amber)' : 'url(#arrow)');

        svg.appendChild(path);
      });
    }

    function deleteNode(id) {
      nodes = nodes.filter(n => n.id !== id);
      connections = connections.filter(c => c.from !== id && c.to !== id);
      renderCanvas();
    }

    function updateStats() {
      document.getElementById('val-total-steps').innerText = nodes.length;
      document.getElementById('val-total-links').innerText = connections.length;
      const gaps = nodes.filter(n => n.isGap).length;
      document.getElementById('val-total-gaps').innerText = gaps;
    }

    // Button Listeners
    document.getElementById('btn-add-node').addEventListener('click', () => {
      const newId = `node-${Date.now()}`;
      nodes.push({
        id: newId,
        x: 100 + Math.random() * 200,
        y: 120 + Math.random() * 200,
        badge: 'NEW STEP',
        isGap: false,
        title: 'New Process Step',
        subtitle: 'Subsystem / Agent',
        desc: 'Click here to describe this step or flag it as an operational gap.'
      });
      renderCanvas();
    });

    document.getElementById('btn-load-arkm').addEventListener('click', () => {
      nodes = JSON.parse(JSON.stringify(PRESET_ARKM));
      connections = JSON.parse(JSON.stringify(CONNECTIONS_ARKM));
      renderCanvas();
    });

    document.getElementById('btn-load-agents').addEventListener('click', () => {
      nodes = JSON.parse(JSON.stringify(PRESET_AGENTS));
      connections = JSON.parse(JSON.stringify(CONNECTIONS_AGENTS));
      renderCanvas();
    });

    document.getElementById('btn-toggle-gaps').addEventListener('click', (e) => {
      highlightGapsActive = !highlightGapsActive;
      e.currentTarget.classList.toggle('active', highlightGapsActive);
      renderCanvas();
    });

    document.getElementById('btn-clear').addEventListener('click', () => {
      nodes = [];
      connections = [];
      renderCanvas();
    });

    document.getElementById('btn-export-json').addEventListener('click', () => {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({ nodes, connections }, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `qt_workflow_${Date.now()}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    });

    // Initial Load: Load ARKM pipeline by default
    nodes = JSON.parse(JSON.stringify(PRESET_ARKM));
    connections = JSON.parse(JSON.stringify(CONNECTIONS_ARKM));
    renderCanvas();
  </script>
</body>
</html>
