#
# INSTRUCTIONS:
# 1. Place this file in /etc/nginx/conf.d/block_php2shell.conf or include inside
#    your server { ... } block before the 'location ~ \.php$' directive.
# 2. Test configuration: nginx -t
# 3. Reload cleanly: systemctl reload nginx
#
# HOW IT WORKS:
# Neutralizes the RFC1867 upload progress trigger entirely at the edge.
# Attackers cannot trigger the memory corruption bug because the request
# never reaches the PHP worker process. ZERO DOWNTIME.
# ==============================================================================

# Option A: Block multipart requests containing PHP_SESSION_UPLOAD_PROGRESS
if ($http_content_type ~* "multipart/form-data") {
    set $php2shell_check "M";
}
if ($arg_PHP_SESSION_UPLOAD_PROGRESS != "") {
    set $php2shell_check "${php2shell_check}P";
}
if ($php2shell_check = "MP") {
    return 403 "Blocked by QT Analytics Sovereign Sentry [PHP2Shell Trigger Neutralized]";
}

# Option B: Block custom scanner header injections
if ($http_php_session_upload_progress != "") {
    return 403 "Blocked by QT Analytics Sovereign Sentry [PHP2Shell Header Blocked]";
}
